<script src="https://telegram.org/js/telegram-web-app.js?63"></script>

<script>
/* =====================================================
   CALL CENTER — REAL TELEGRAM + GOOGLE SHEETS
   ===================================================== */

const API =
  "https://script.google.com/macros/s/AKfycbyM3BhwYuxWxEfjC5emg_MqAG7YBaHCpqetnjwANKSLp4U2DRk-5ZfGNSw3peOiWK5K/exec";


/* =====================================================
   GLOBAL
   ===================================================== */

let tg = null;
let currentUser = null;


/* =====================================================
   TELEGRAM INIT
   ===================================================== */

function initTelegram() {

  if (
    !window.Telegram ||
    !window.Telegram.WebApp
  ) {

    console.error(
      "Telegram WebApp topilmadi"
    );

    showToast(
      "Ilovani Telegram ichidan oching"
    );

    return false;
  }


  tg = window.Telegram.WebApp;


  tg.ready();
  tg.expand();


  if (tg.setHeaderColor) {

    tg.setHeaderColor(
      "#f5f7fb"
    );

  }


  if (tg.setBackgroundColor) {

    tg.setBackgroundColor(
      "#f5f7fb"
    );

  }


  console.log(
    "Telegram WebApp tayyor"
  );


  console.log(
    "Telegram initData:",
    tg.initData
  );


  return true;
}


/* =====================================================
   LOAD PROFILE
   ===================================================== */

async function loadProfile() {

  if (!tg) {

    showToast(
      "Telegram WebApp ulanmagan"
    );

    return;
  }


  const initData =
    tg.initData;


  if (!initData) {

    console.error(
      "tg.initData bo'sh"
    );


    showToast(
      "Telegram ma'lumotlari topilmadi. Botdan Web App'ni qayta oching."
    );


    return;
  }


  try {

    showLoading();


    const url =
      API +
      "?action=profile&initData=" +
      encodeURIComponent(
        initData
      );


    console.log(
      "PROFILE REQUEST:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "PROFILE RESPONSE:",
      data
    );


    hideLoading();


    if (!data.ok) {

      handleAPIError(
        data
      );

      return;
    }


    currentUser =
      data;


    renderUser(
      data
    );


  }

  catch (error) {

    hideLoading();


    console.error(
      "PROFILE ERROR:",
      error
    );


    showToast(
      "Server bilan bog'lanib bo'lmadi"
    );

  }

}


/* =====================================================
   API ERROR
   ===================================================== */

function handleAPIError(
  data
) {

  console.error(
    "API ERROR:",
    data
  );


  if (
    data.error ===
    "not_registered"
  ) {

    showToast(
      "Siz hali bot orqali ro'yxatdan o'tmagansiz."
    );


    return;
  }


  if (
    data.error ===
    "not_approved"
  ) {

    showToast(
      "Admin hali sizni tasdiqlamagan."
    );


    return;
  }


  if (
    data.error ===
    "auth_bad_hash"
  ) {

    showToast(
      "Telegram autentifikatsiya xatosi."
    );


    return;
  }


  if (
    data.error ===
    "auth_expired"
  ) {

    showToast(
      "Sessiya eskirgan. Botdan Web App'ni qayta oching."
    );


    return;
  }


  if (
    data.error ===
    "auth_no_initdata"
  ) {

    showToast(
      "Telegram initData topilmadi."
    );


    return;
  }


  showToast(
    data.message ||
    "Noma'lum xatolik"
  );

}


/* =====================================================
   RENDER USER
   ===================================================== */

function renderUser(
  user
) {

  const fio =
    user.fio ||
    user.ism ||
    "Foydalanuvchi";


  const role =
    user.role ||
    user.lavozim ||
    "Xodim";


  /*
   * HOME
   */

  setText(
    ".top-header .name",
    fio
  );


  /*
   * ROLE BADGE
   */

  setText(
    ".role-badge",
    role
  );


  /*
   * PROFILE NAME
   */

  setText(
    ".profile-name",
    fio
  );


  /*
   * PROFILE ROLE
   */

  setText(
    ".profile-role",
    role + " · Aktiv"
  );


  /*
   * PROFILE INFORMATION
   */

  renderProfileFields(
    user
  );


  /*
   * AVATAR
   */

  renderAvatar(
    user
  );


  /*
   * DAVOMAT
   */

  renderAttendance(
    user
  );


  /*
   * ROLE
   */

  setupRole(
    role
  );


  /*
   * Dashboard
   */

  updateDashboard(
    user
  );

}


/* =====================================================
   TEXT HELPER
   ===================================================== */

function setText(
  selector,
  value
) {

  const element =
    document.querySelector(
      selector
    );


  if (element) {

    element.textContent =
      value || "";

  }

}


/* =====================================================
   PROFILE FIELDS
   ===================================================== */

function renderProfileFields(
  user
) {

  const fields =
    document.querySelectorAll(
      ".profile-item"
    );


  fields.forEach(
    function(item) {

      const label =
        item.querySelector(
          ".profile-item-label"
        );


      const value =
        item.querySelector(
          ".profile-item-value"
        );


      if (!label || !value) {

        return;

      }


      const labelText =
        label.textContent
          .trim()
          .toLowerCase();


      if (
        labelText.includes(
          "f.i.sh"
        )
      ) {

        value.textContent =
          user.fio ||
          user.ism ||
          "";

      }


      else if (
        labelText.includes(
          "lavozim"
        )
      ) {

        value.textContent =
          user.role ||
          user.lavozim ||
          "";

      }


      else if (
        labelText.includes(
          "telegram"
        )
      ) {

        if (
          user.username
        ) {

          value.textContent =
            "@" +
            user.username;

        }

        else {

          value.textContent =
            "Telegram";

        }

      }


      else if (
        labelText.includes(
          "status"
        )
      ) {

        value.textContent =
          "Aktiv";

      }

    }
  );

}


/* =====================================================
   AVATAR
   ===================================================== */

function renderAvatar(
  user
) {

  const avatar =
    document.querySelector(
      ".avatar"
    );


  if (!avatar) {

    return;

  }


  avatar.innerHTML = "";


  if (
    user.photo_url
  ) {

    const image =
      document.createElement(
        "img"
      );


    image.src =
      user.photo_url;


    image.alt =
      user.fio ||
      "Telegram";


    image.loading =
      "eager";


    image.referrerPolicy =
      "no-referrer";


    image.style.width =
      "100%";


    image.style.height =
      "100%";


    image.style.objectFit =
      "cover";


    image.style.borderRadius =
      "50%";


    avatar.appendChild(
      image
    );


    return;

  }


  /*
   * Photo yo'q bo'lsa
   * initials
   */

  avatar.textContent =
    getInitials(
      user.fio ||
      user.ism ||
      "U"
    );

}


/* =====================================================
   INITIALS
   ===================================================== */

function getInitials(
  name
) {

  const words =
    String(name)
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  if (
    words.length === 0
  ) {

    return "U";

  }


  if (
    words.length === 1
  ) {

    return words[0]
      .substring(0, 1)
      .toUpperCase();

  }


  return (
    words[0]
      .substring(0, 1) +

    words[1]
      .substring(0, 1)
  ).toUpperCase();

}


/* =====================================================
   ATTENDANCE
   ===================================================== */

function renderAttendance(
  user
) {

  const times =
    user.times || {};


  const arrival =
    times.Keldi || "";


  const departure =
    times.Ketdi || "";


  const worked =
    user.worked || "";


  /*
   * Kelgan vaqt
   */

  setText(
    ".arrival-time",
    arrival || "--:--"
  );


  /*
   * Ishlagan vaqt
   */

  const workElement =
    document.querySelector(
      ".work-time"
    );


  if (workElement) {

    if (worked) {

      workElement.textContent =
        worked;

    }

    else if (
      arrival &&
      !departure
    ) {

      workElement.textContent =
        "Hozirda ishda";

    }

    else {

      workElement.textContent =
        "Hali kelmagan";

    }

  }


  /*
   * Status
   */

  const status =
    document.querySelector(
      ".status"
    );


  if (!status) {

    return;

  }


  if (
    arrival &&
    !departure
  ) {

    status.innerHTML =
      `
      <span
        class="status-dot"
      ></span>
      ISHDA
      `;

  }


  else if (
    arrival &&
    departure
  ) {

    status.innerHTML =
      `
      <span
        class="status-dot"
        style="background:#98a2b3"
      ></span>
      KETDI
      `;

  }


  else {

    status.innerHTML =
      `
      <span
        class="status-dot"
        style="background:#f79009"
      ></span>
      KELMAGAN
      `;

  }

}


/* =====================================================
   DASHBOARD
   ===================================================== */

function updateDashboard(
  user
) {

  /*
   * Demo qiymatlarni real
   * qiymatlar bilan almashtirish
   */

  const arrival =
    user.times &&
    user.times.Keldi
      ? user.times.Keldi
      : "--:--";


  const departure =
    user.times &&
    user.times.Ketdi
      ? user.times.Ketdi
      : "--:--";


  const worked =
    user.worked ||
    "0 soat 0 daqiqa";


  /*
   * HTMLdagi vaqt bloklarini
   * avtomatik yangilash
   */

  document
    .querySelectorAll(
      "[data-real='arrival']"
    )
    .forEach(
      function(element) {

        element.textContent =
          arrival;

      }
    );


  document
    .querySelectorAll(
      "[data-real='departure']"
    )
    .forEach(
      function(element) {

        element.textContent =
          departure;

      }
    );


  document
    .querySelectorAll(
      "[data-real='worked']"
    )
    .forEach(
      function(element) {

        element.textContent =
          worked;

      }
    );

}


/* =====================================================
   ROLE
   ===================================================== */

function setupRole(
  role
) {

  const normalized =
    String(role)
      .trim()
      .toLowerCase();


  document.body
    .setAttribute(
      "data-role",
      normalized
    );


  console.log(
    "REAL USER ROLE:",
    role
  );


  /*
   * Keyingi bosqichda:
   *
   * Pervichka
   * Shartnomachi
   * To'lovchi
   * Bazavik
   * Admin
   * CEO
   *
   * uchun alohida dashboard
   * ochamiz.
   */

}


/* =====================================================
   PAGE NAVIGATION
   ===================================================== */

function openPage(
  page
) {

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      function(section) {

        section.classList
          .remove(
            "active"
          );

      }
    );


  const target =
    document.getElementById(
      page
    );


  if (target) {

    target.classList
      .add(
        "active"
      );

  }


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });


  closeMenu();


  /*
   * AI input
   */

  const aiInput =
    document.querySelector(
      ".ai-input"
    );


  if (aiInput) {

    aiInput.style.display =
      page === "ai"
        ? "flex"
        : "none";

  }

}


/* =====================================================
   MENU
   ===================================================== */

function openMenu() {

  const overlay =
    document.getElementById(
      "overlay"
    );


  if (overlay) {

    overlay.classList
      .add("open");

  }

}


function closeMenu(
  event
) {

  if (
    event &&
    event.target &&
    event.target.id !==
      "overlay"
  ) {

    return;

  }


  const overlay =
    document.getElementById(
      "overlay"
    );


  if (overlay) {

    overlay.classList
      .remove("open");

  }

}


function menuNavigate(
  page
) {

  closeMenu();


  setTimeout(
    function() {

      openPage(
        page
      );

    },
    150
  );

}


/* =====================================================
   TASK MODAL
   ===================================================== */

function openTask(
  name
) {

  const title =
    document.getElementById(
      "modalTaskTitle"
    );


  if (title) {

    title.textContent =
      name;

  }


  const modal =
    document.getElementById(
      "taskModal"
    );


  if (modal) {

    modal.classList
      .add("open");

  }

}


function closeTask(
  event
) {

  if (
    event &&
    event.target &&
    event.target.id !==
      "taskModal"
  ) {

    return;

  }


  const modal =
    document.getElementById(
      "taskModal"
    );


  if (modal) {

    modal.classList
      .remove("open");

  }

}


function completeTask() {

  closeTask();


  showToast(
    "Topshiriq bajarildi"
  );

}


/* =====================================================
   KNOWLEDGE
   ===================================================== */

function searchKnowledge(
  value
) {

  const cards =
    document.querySelectorAll(
      "#knowledgeGrid .knowledge-card"
    );


  const query =
    String(value || "")
      .toLowerCase()
      .trim();


  cards.forEach(
    function(card) {

      const text =
        card.textContent
          .toLowerCase();


      card.style.display =
        text.includes(
          query
        )
          ? ""
          : "none";

    }
  );

}


/* =====================================================
   TOAST
   ===================================================== */

let toastTimer = null;


function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  if (!toast) {

    console.log(
      "TOAST:",
      message
    );

    return;

  }


  toast.textContent =
    message;


  toast.classList
    .add("show");


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function() {

        toast.classList
          .remove("show");

      },
      3000
    );

}


/* =====================================================
   LOADING
   ===================================================== */

function showLoading() {

  document.body
    .classList
    .add(
      "loading-profile"
    );

}


function hideLoading() {

  document.body
    .classList
    .remove(
      "loading-profile"
    );

}


/* =====================================================
   AI
   ===================================================== */

function sendAIMessage() {

  const input =
    document.getElementById(
      "aiMessage"
    );


  if (!input) {

    return;

  }


  const message =
    input.value.trim();


  if (!message) {

    return;

  }


  const chat =
    document.getElementById(
      "chat"
    );


  if (!chat) {

    return;

  }


  const userMessage =
    document.createElement(
      "div"
    );


  userMessage.className =
    "message user";


  userMessage.textContent =
    message;


  chat.appendChild(
    userMessage
  );


  input.value = "";


  setTimeout(
    function() {

      const aiMessage =
        document.createElement(
          "div"
        );


      aiMessage.className =
        "message ai";


      aiMessage.textContent =
        "Savolingiz qabul qilindi. AI backend keyingi bosqichda ulanadi.";


      chat.appendChild(
        aiMessage
      );


      chat.scrollTop =
        chat.scrollHeight;

    },
    500
  );

}


/* =====================================================
   START
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  async function() {

    console.log(
      "CALL CENTER APP START"
    );


    /*
     * Telegram
     */

    const telegramReady =
      initTelegram();


    if (!telegramReady) {

      return;

    }


    /*
     * AI input
     */

    const aiInput =
      document.querySelector(
        ".ai-input"
      );


    if (aiInput) {

      aiInput.style.display =
        "none";

    }


    /*
     * REAL GOOGLE SHEETS DATA
     */

    await loadProfile();

  }
);

</script>
